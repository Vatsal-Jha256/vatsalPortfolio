<!doctype html>
<html lang="en" data-theme="paper" data-density="airy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vatsal Jha</title>
<meta name="description" content="Vatsal Jha's portfolio: applied ML, agentic systems, reinforcement learning, research, projects, publications, and selected work.">
<meta name="author" content="Vatsal Jha">
<meta property="og:title" content="Vatsal Jha">
<meta property="og:description" content="Applied ML, agentic systems, reinforcement learning, research, projects, publications, and selected work.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/portrait.jpg">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#f3ede1;
    --paper-2:#ebe3d4;
    --ink:#1a1714;
    --ink-2:#3a3530;
    --muted:#7a6f63;
    --rule:#d8cfbe;
    --accent:#c47a1d;
    --highlight:#e9b04a;
    --serif:'Instrument Serif', 'Newsreader', Georgia, serif;
    --sans:'Geist', ui-sans-serif, system-ui, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
    --hand:'Caveat', cursive;
    --pad-y: clamp(56px, 8vw, 120px);
    --max: 1180px;
    --gutter: clamp(20px, 4vw, 56px);
  }
  /* themes */
  html[data-theme="sepia"]{
    --paper:#ede0c8; --paper-2:#e3d3b4; --ink:#2a1f12; --ink-2:#4a3a26;
    --muted:#7a6342; --rule:#cdb88f; --accent:#8a3a1f;
  }
  html[data-theme="dark"]{
    --paper:#15130f; --paper-2:#1d1a14; --ink:#f1e9d8; --ink-2:#c8bfae;
    --muted:#8a7f70; --rule:#322c23; --accent:#e08259; --highlight:#e9b04a;
  }
  html[data-density="airy"]{ --pad-y: clamp(80px, 11vw, 160px); }
  html[data-density="compact"]{ --pad-y: clamp(40px, 6vw, 80px); }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-weight:400;
    font-size:17px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
    transition:background .35s ease, color .35s ease;
  }
  /* paper grain */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
    background-image:
      radial-gradient(rgba(0,0,0,.025) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,.018) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode: multiply;
    opacity:.6;
  }
  html[data-theme="dark"] body::before{ mix-blend-mode:screen; opacity:.35; }

  ::selection{ background:var(--accent); color:var(--paper); }

  a{color:inherit; text-decoration:none}
  a.link{
    border-bottom:1px solid var(--rule);
    transition:border-color .2s, color .2s;
    padding-bottom:1px;
  }
  a.link:hover{ color:var(--accent); border-color:var(--accent); }

  /* layout */
  main{ position:relative; z-index:2; }
  .wrap{
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 var(--gutter);
  }
  .section{
    padding: var(--pad-y) 0;
    border-top: 1px solid var(--rule);
    position:relative;
  }
  .section:first-of-type{ border-top:0; }

  /* type */
  h1,h2,h3,h4{ font-family:var(--serif); font-weight:400; letter-spacing:-.005em; margin:0; line-height:1.02; }
  h1{ font-size: clamp(72px, 13vw, 180px); }
  h2{ font-size: clamp(38px, 6vw, 72px); }
  h3{ font-size: clamp(24px, 2.4vw, 32px); line-height:1.1; }
  h4{ font-size: 20px; }
  .it{ font-style:italic; }
  p{ margin:0 0 1em; max-width: 64ch; }
  .lead{ font-size: clamp(20px, 1.8vw, 24px); line-height:1.5; color:var(--ink-2); max-width: 36ch; }
  .body-narrow{ max-width: 56ch; }

  /* meta labels */
  .label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:500;
  }
  .num{
    font-family:var(--mono);
    font-size:11px;
    color:var(--accent);
    letter-spacing:.1em;
  }
  .sec-head{
    display:flex; align-items:baseline; gap:18px;
    margin-bottom: 40px;
    flex-wrap:wrap;
  }
  .sec-head .num{ flex:0 0 auto; }
  .sec-head .label{ flex:1; }
  .sec-head .label::before{
    content:""; display:inline-block; width:48px; height:1px;
    background:var(--muted); vertical-align:middle; margin-right:14px;
  }

  /* nav */
  nav.topnav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; justify-content:space-between; align-items:center;
    padding: 18px var(--gutter);
    font-family:var(--mono); font-size:12px; letter-spacing:.06em;
    mix-blend-mode: multiply;
    pointer-events:none;
  }
  html[data-theme="dark"] nav.topnav{ mix-blend-mode: screen; }
  nav.topnav > *{ pointer-events:auto; }
  nav.topnav .brand{ font-weight:600; color:var(--ink); }
  nav.topnav .nav-links{ display:flex; gap:22px; }
  nav.topnav .nav-links a{ color:var(--muted); transition:color .2s; }
  nav.topnav .nav-links a:hover{ color:var(--accent); }
  @media (max-width: 820px){ nav.topnav .nav-links{ display:none } }

  /* hero */
  .hero{
    min-height: 100vh;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding-bottom: clamp(40px, 6vw, 80px);
    padding-top: 120px;
    border-top:0;
    position: relative;
  }

  /* tipped-in portrait (editorial hero) */
  .portrait{
    position: absolute;
    top: clamp(90px, 12vw, 150px);
    right: var(--gutter);
    width: clamp(180px, 18vw, 240px);
    padding: 14px 14px 56px;
    background: #fbf8f1;
    box-shadow:
      0 1px 0 rgba(0,0,0,.04),
      0 18px 36px -18px rgba(40,30,20,.35),
      0 6px 14px -8px rgba(40,30,20,.22);
    transform: rotate(2.4deg);
    transform-origin: top right;
    z-index: 3;
    transition: transform .4s cubic-bezier(.3,.7,.3,1);
  }
  html[data-theme="dark"] .portrait{
    background: #1f1c16;
    box-shadow:
      0 1px 0 rgba(255,255,255,.04),
      0 18px 36px -18px rgba(0,0,0,.6),
      0 6px 14px -8px rgba(0,0,0,.5);
  }
  .portrait::before{
    /* washi-tape strip */
    content: "";
    position: absolute;
    top: -14px; left: 50%;
    width: 78px; height: 22px;
    transform: translateX(-50%) rotate(-3deg);
    background: linear-gradient(135deg, rgba(233,176,74,.55), rgba(233,176,74,.35));
    border-left: 1px dashed rgba(0,0,0,.08);
    border-right: 1px dashed rgba(0,0,0,.08);
    box-shadow: 0 2px 4px -2px rgba(0,0,0,.15);
  }
  .portrait img{
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4/5;
    object-fit: cover;
    object-position: 50% 22%;
    filter: saturate(.95) contrast(1.02);
  }
  .portrait .cap{
    position: absolute;
    left: 0; right: 0; bottom: 14px;
    text-align: center;
    font-family: var(--hand);
    font-size: 22px;
    color: var(--ink-2);
    line-height: 1;
    transform: rotate(-1deg);
  }
  .portrait:hover{ transform: rotate(0deg) translateY(-2px); }
  @media (max-width: 900px){
    .portrait{
      position: static;
      width: 180px;
      margin: 0 0 28px auto;
      transform: rotate(2deg);
    }
  }
  .hero .top-meta{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom: clamp(40px, 8vw, 120px);
    flex-wrap:wrap; gap:24px;
  }
  .hero h1{
    margin-left:-.05em;
    color:var(--ink);
  }
  .hero h1 .amp{ font-style:italic; color:var(--accent); }
  .hero .sub{
    display:grid; grid-template-columns: 1fr 1fr; gap:48px;
    margin-top: clamp(40px, 6vw, 72px);
  }
  @media (max-width:760px){ .hero .sub{ grid-template-columns:1fr; gap:28px; } }
  .hero .sub .lead{ max-width: 28ch; }
  .hero .sub .right{ font-family:var(--mono); font-size:12.5px; line-height:1.9; color:var(--muted); }
  .hero .sub .right .k{ color:var(--ink-2); }
  .hero .sub .right a:hover{ color:var(--accent); }
  @media (max-width: 560px){
    .hero{ min-height:auto; padding-top: 92px; }
    .hero .top-meta{
      display:block;
      margin-bottom: 28px;
    }
    .hero .top-meta .label{
      overflow-wrap:anywhere;
      margin-bottom: 8px;
    }
    .portrait{
      width: min(180px, 54vw);
      margin: 0 auto 28px;
    }
    .hero h1{ font-size: clamp(58px, 19vw, 72px); }
    .hero .sub,
    .hero .sub > *{
      min-width: 0;
      width: 100%;
    }
    .hero .sub .lead{ max-width: 24ch; }
    .hero .sub .right{
      font-size: 11.5px;
      max-width: 28ch;
      overflow-wrap:anywhere;
    }
  }

  /* now grid */
  .now-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    margin-top: 8px;
  }
  @media (max-width: 920px){ .now-grid{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px){ .now-grid{ grid-template-columns: 1fr; } }
  .now-cell{
    background:var(--paper);
    padding: 22px 22px 20px;
    display:flex; flex-direction:column; gap:8px;
    transition: background .25s;
    min-height: 150px;
  }
  .now-cell:hover{ background:var(--paper-2); }
  .now-cell .label{ display:flex; align-items:center; gap:10px; }
  .now-cell .label .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block; }
  .now-cell .title{ font-family:var(--serif); font-size:22px; line-height:1.15; }
  .now-cell .meta{ font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:auto; }

  /* work entries */
  .work-list{ display:flex; flex-direction:column; }
  .work-row{
    display:grid;
    grid-template-columns: 90px 1fr 1fr 110px;
    gap: 28px;
    padding: 26px 0;
    border-top: 1px solid var(--rule);
    align-items:baseline;
    cursor: default;
  }
  .work-row:last-child{ border-bottom: 1px solid var(--rule); }
  .work-row .yr{ font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.04em; }
  .work-row .role{ font-family:var(--serif); font-size: clamp(22px, 2.2vw, 28px); line-height:1.15; }
  .work-row .role em{ display:block; font-family:var(--sans); font-style:normal; font-size:13px; color:var(--muted); margin-top:4px; letter-spacing:.02em; }
  .work-row .desc{ font-size: 15px; color:var(--ink-2); }
  .work-row .tag{ font-family:var(--mono); font-size:11px; color:var(--accent); text-align:right; letter-spacing:.08em; text-transform:uppercase; }
  .work-row:hover{ background: var(--paper-2); margin: 0 calc(var(--gutter)*-.4); padding-left: calc(var(--gutter)*.4); padding-right: calc(var(--gutter)*.4); }
  @media (max-width:800px){
    .work-row{ grid-template-columns: 1fr; gap:6px; padding:22px 0; }
    .work-row .tag{ text-align:left; }
  }

  /* projects */
  .projects{ display:grid; grid-template-columns: 1fr 1fr; gap: 1px; background:var(--rule); border:1px solid var(--rule); }
  @media (max-width: 800px){ .projects{ grid-template-columns:1fr; } }
  .project{
    background:var(--paper);
    padding: 36px 32px 32px;
    display:flex; flex-direction:column; gap:16px;
    min-height: 320px;
    position:relative;
    transition: background .25s;
  }
  .project:hover{ background:var(--paper-2); }
  .project .ph{ display:flex; justify-content:space-between; align-items:baseline; }
  .project h3{ font-style:italic; }
  .project .blurb{ color:var(--ink-2); font-size:15.5px; max-width:46ch; }
  .project .meta-line{
    margin-top:auto;
    font-family:var(--mono); font-size:11px; color:var(--muted);
    letter-spacing:.06em; text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
  }
  .project .meta-line .arrow{ color:var(--accent); transition: transform .25s; }
  .project:hover .meta-line .arrow{ transform: translate(3px, -3px); }
  .project .award{
    font-family:var(--mono); font-size:11px; color:var(--accent);
    letter-spacing:.06em; text-transform:uppercase;
  }
  .project.featured{ grid-column: span 2; min-height:auto; }
  @media (max-width:800px){ .project.featured{ grid-column:auto; } }

  /* ───────── Achievements ribbon ───────── */
  .ribbon{
    margin-top: 56px;
    padding: 28px 0 0;
    border-top: 1px solid var(--rule);
  }
  .ribbon-label{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted);
    margin-bottom: 20px;
  }
  .ribbon-list{
    display:grid; grid-template-columns: repeat(2, 1fr);
    gap: 14px 32px;
  }
  @media (max-width: 720px){ .ribbon-list{ grid-template-columns: 1fr; } }
  .ribbon-item{
    display:grid; grid-template-columns: 60px 1fr; gap: 14px;
    padding: 10px 0;
    align-items:baseline;
  }
  .ri-yr{ font-family:var(--mono); font-size:11.5px; color:var(--muted); letter-spacing:.04em; }
  .ri-t{ font-family:var(--serif); font-size: 19px; line-height:1.2; color:var(--ink); }
  .ri-acc{ color:var(--accent); font-style:italic; }
  .ri-n{ font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:2px; letter-spacing:.04em; }

  /* ───────── Leadership & Service ───────── */
  .lead-list{ display:flex; flex-direction:column; max-width: 920px; }
  .lead-row{
    display:grid; grid-template-columns: 180px 1fr; gap: 36px;
    padding: 32px 0;
    border-top: 1px solid var(--rule);
    align-items:baseline;
  }
  .lead-row:last-child{ border-bottom: 1px solid var(--rule); }
  .lead-row .when{ font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.04em; }
  .lead-row .role{ font-family:var(--serif); font-size: clamp(24px, 2.6vw, 32px); line-height:1.1; color:var(--ink); }
  .lead-row .role .org{ color:var(--muted); font-style:italic; }
  .lead-row .desc{ margin: 12px 0 0; color:var(--ink-2); font-size: 15.5px; max-width: 56ch; }
  .lead-row .note{
    margin-top: 10px;
    font-family:var(--serif); font-style:italic; font-size: 16px; color:var(--accent);
    max-width: 50ch;
  }
  @media (max-width: 720px){
    .lead-row{ grid-template-columns: 1fr; gap: 8px; padding: 24px 0; }
  }

  /* ───────── Beliefs ───────── */
  .beliefs{
    list-style:none; padding:0; margin:0;
    display:flex; flex-direction:column;
    max-width: 820px;
    counter-reset: belief;
  }
  .beliefs li{
    display:grid; grid-template-columns: 60px 1fr; gap: 24px;
    padding: 22px 0;
    border-top: 1px solid var(--rule);
    align-items:baseline;
  }
  .beliefs li:last-child{ border-bottom: 1px solid var(--rule); }
  .b-n{ font-family:var(--mono); font-size:11.5px; color:var(--accent); letter-spacing:.06em; padding-top:6px; }
  .b-t{
    font-family:var(--serif); font-size: clamp(22px, 2.6vw, 30px);
    line-height: 1.25; color:var(--ink); font-style: italic;
    text-wrap: pretty;
  }
  .pub-list{ display:flex; flex-direction:column; border-top:1px solid var(--rule); }
  .pub-row{
    display:grid;
    grid-template-columns: 70px 1fr 220px 90px;
    gap: 28px;
    padding: 22px 0;
    border-bottom: 1px solid var(--rule);
    align-items:baseline;
  }
  .pub-row .yr{ font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.04em; }
  .pub-row .title{ font-family:var(--serif); font-size: clamp(18px, 1.8vw, 22px); line-height:1.25; }
  .pub-row .title a:hover{ color:var(--accent); }
  .pub-row .venue{ font-size:13px; color:var(--ink-2); font-style:italic; }
  .pub-row .role{ font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; text-align:right; }
  @media (max-width: 820px){
    .pub-row{ grid-template-columns: 1fr; gap:6px; padding:18px 0; }
    .pub-row .role{ text-align:left; }
  }

  /* ───────── Log (books/music/film/games) ───────── */
  .log-grid{
    display:grid; grid-template-columns: repeat(4, 1fr);
    gap: 1px; background:var(--rule); border:1px solid var(--rule);
  }
  @media (max-width: 920px){ .log-grid{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px){ .log-grid{ grid-template-columns: 1fr; } }
  .log-col{ background:var(--paper); padding: 24px 22px 22px; }
  .log-h{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted);
    padding-bottom: 14px; margin-bottom: 14px;
    border-bottom: 1px dashed var(--rule);
  }
  .log-col ul{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:18px; }
  .log-col li{ font-size: 14px; line-height:1.4; }
  .log-t{ font-family:var(--serif); font-size: 20px; font-style:italic; line-height:1.15; color:var(--ink); }
  .log-a{ font-size: 12.5px; color:var(--muted); margin-top:2px; }
  .log-n{ font-size: 13px; color:var(--ink-2); margin-top:6px; max-width: 28ch; }

  /* ───────── Travel ───────── */
  .travel-intro{
    font-family:var(--serif); font-style:italic;
    font-size: clamp(18px, 1.6vw, 22px);
    line-height: 1.4;
    color:var(--ink-2);
    max-width: 56ch;
    margin-bottom: 44px;
  }
  .travel-wrap{
    display:grid; grid-template-columns: 1fr 280px;
    gap: clamp(40px, 6vw, 88px);
    align-items:start;
  }
  @media (max-width: 900px){ .travel-wrap{ grid-template-columns: 1fr; } }

  .travel-list{
    list-style:none; padding:0; margin:0;
    position:relative;
    max-width: 720px;
  }
  .travel-list::before{
    content:""; position:absolute;
    left: 78px; top: 8px; bottom: 8px;
    width:1px; background: var(--rule);
  }
  .travel-row{
    display:grid; grid-template-columns: 70px 1fr;
    gap: 36px;
    padding: 22px 0;
    align-items:baseline;
    position:relative;
  }
  .travel-row + .travel-row{ border-top: 1px dashed var(--rule); }
  .travel-row::before{
    content:""; position:absolute;
    left: 76px; top: 32px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--paper);
    z-index: 1;
  }
  .travel-row.draft::before{
    background: var(--paper);
    border: 1.5px dashed var(--muted);
    box-shadow: 0 0 0 3px var(--paper);
  }
  .travel-row .when{
    font-family:var(--mono); font-size:11.5px;
    color:var(--muted); letter-spacing:.04em;
    padding-top: 6px;
    text-align: right;
  }
  .travel-row .body{ padding-left: 22px; }
  .travel-row .place{
    font-family:var(--serif);
    font-size: clamp(22px, 2.4vw, 28px);
    line-height: 1.15;
    color: var(--ink);
    font-style: italic;
  }
  .travel-row.draft .place{ color: var(--muted); font-style:italic; }
  .travel-row .place .pin{
    font-family:var(--mono); font-style:normal;
    font-size: 11px; color:var(--accent);
    letter-spacing: .08em; text-transform: uppercase;
    margin-left: 8px;
    vertical-align: 4px;
  }
  .travel-row .note{
    margin-top: 8px;
    font-size: 15px; line-height: 1.55;
    color: var(--ink-2);
    max-width: 50ch;
  }
  .travel-row .note .keep{
    display: block;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 8px;
    letter-spacing: .02em;
  }
  .travel-row.draft .note{ color: var(--muted); font-style: italic; }

  .travel-tally{
    border: 1px solid var(--rule);
    padding: 22px 22px 20px;
    background: var(--paper);
  }
  .travel-tally .label{ margin-bottom: 16px; display:block; }
  .travel-tally dl{
    margin: 0; display:grid;
    grid-template-columns: 1fr auto;
    row-gap: 10px; column-gap: 14px;
  }
  .travel-tally dt{
    font-family: var(--serif); font-style: italic;
    font-size: 16px; color: var(--ink-2);
  }
  .travel-tally dd{
    margin: 0;
    font-family: var(--mono); font-size: 12px;
    color: var(--ink); letter-spacing: .04em;
    align-self: center;
  }
  .travel-tally dd .acc{ color: var(--accent); }
  .travel-tally .foot{
    margin-top: 18px; padding-top: 14px;
    border-top: 1px dashed var(--rule);
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); letter-spacing: .04em;
    line-height: 1.5;
  }

  @media (max-width: 600px){
    .travel-list::before{ left: 8px; }
    .travel-row{ grid-template-columns: 1fr; gap: 4px; padding-left: 28px; }
    .travel-row::before{ left: 6px; top: 8px; }
    .travel-row .when{ text-align:left; padding-top: 0; }
    .travel-row .body{ padding-left: 0; }
  }

  /* ───────── Notes ───────── */
  .notes-list{ display:flex; flex-direction:column; border-top:1px solid var(--rule); max-width: 820px; }
  .note-row{
    display:grid; grid-template-columns: 70px 1fr 80px;
    gap: 28px; padding: 22px 0;
    border-bottom: 1px solid var(--rule);
    align-items:baseline;
  }
  .note-row .yr{ font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.04em; }
  .note-row .t{ font-family:var(--serif); font-size: clamp(20px, 2vw, 26px); line-height:1.2; color:var(--ink); }
  .note-row .s{ font-size: 13.5px; color:var(--ink-2); margin-top:4px; max-width: 50ch; }
  .note-row .tag{
    font-family:var(--mono); font-size:10.5px; color:var(--muted);
    letter-spacing:.08em; text-transform:uppercase; text-align:right;
  }
  @media (max-width: 700px){
    .note-row{ grid-template-columns: 1fr; gap:4px; }
    .note-row .tag{ text-align:left; }
  }

  /* off-screen */
  .offscreen{ display:grid; grid-template-columns: 1.1fr .9fr; gap: clamp(40px, 6vw, 90px); align-items:start; }
  @media (max-width: 860px){ .offscreen{ grid-template-columns:1fr; } }
  .offscreen .essay p{ font-family:var(--serif); font-size: clamp(20px, 1.7vw, 24px); line-height:1.5; color:var(--ink); max-width: 32ch; }
  .offscreen .essay p .acc{ color:var(--accent); font-style:italic; }
  .interests{ display:flex; flex-direction:column; gap:2px; }
  .interest{
    display:grid; grid-template-columns: 24px 130px 1fr; gap:18px; align-items:baseline;
    padding: 14px 0;
    border-bottom: 1px dashed var(--rule);
    font-size: 15px;
    cursor: default;
  }
  .interest:first-child{ border-top: 1px dashed var(--rule); }
  .interest .n{ font-family:var(--mono); font-size:11px; color:var(--muted); }
  .interest .k{ font-family:var(--serif); font-size: 22px; font-style:italic; }
  .interest .v{ color:var(--ink-2); font-size:14.5px; line-height:1.5; }
  .interest:hover .k{ color:var(--accent); }

  /* contact */
  .contact{
    display:grid; grid-template-columns: 1fr 1fr; gap:48px; align-items:end;
  }
  @media (max-width:760px){ .contact{ grid-template-columns:1fr; } }
  .contact h2{ font-size: clamp(48px, 8vw, 96px); line-height:.95; }
  .contact h2 em{ color:var(--accent); }
  .contact .channels{ display:flex; flex-direction:column; gap:14px; }
  .contact .channels a{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1px solid var(--rule);
    padding: 14px 0;
    font-family:var(--mono); font-size:13px; letter-spacing:.04em;
    transition: color .2s;
  }
  .contact .channels a:hover{ color:var(--accent); }
  .contact .channels a .arrow{ transition: transform .25s; }
  .contact .channels a:hover .arrow{ transform: translateX(6px); }

  /* footer */
  footer{
    position:relative; z-index:2;
    border-top: 1px solid var(--rule);
    padding: clamp(40px, 5vw, 60px) var(--gutter);
    display:flex; justify-content:space-between; align-items:flex-end;
    flex-wrap:wrap; gap:24px;
    font-family:var(--mono); font-size:11.5px; color:var(--muted); letter-spacing:.04em;
  }
  footer .sisy{ font-family:var(--serif); font-style:italic; font-size: clamp(20px, 2.2vw, 28px); color:var(--ink); max-width: 22ch; line-height:1.2; letter-spacing:0; text-transform:none; }
  footer .sisy small{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; margin-top:8px; }
  footer .col{ display:flex; flex-direction:column; gap:6px; }
  footer .col b{ color:var(--ink-2); font-weight:500; }

  /* scroll reveal */
  .reveal{ opacity:0; transform: translateY(14px); transition: opacity .8s ease, transform .8s ease; }
  .reveal.in{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){
    .reveal{ opacity:1; transform:none; transition:none; }
  }

  /* signature scribble */
  .sig{
    font-family: var(--hand); font-size: 30px; color:var(--accent);
    line-height:1; transform: rotate(-3deg); display:inline-block;
  }

  /* easter egg cursor dot */
  .cursor-dot{
    position: fixed; top:0; left:0; pointer-events:none; z-index:9999;
    width:8px; height:8px; border-radius:50%;
    background: var(--accent);
    transform: translate(-50%,-50%);
    transition: transform .15s ease, opacity .25s;
    mix-blend-mode: multiply;
    display:none;
  }
  html[data-cursor="on"] .cursor-dot{ display:block; }
  html[data-theme="dark"] .cursor-dot{ mix-blend-mode: screen; }

  /* hidden by default — toggled by tweak */
  html[data-show-playful="off"] [data-playful]{ display:none; }

  /* projects need to also be links now */
  .project{ color:inherit; text-decoration:none; }

  /* ─────────── Terminal hero ─────────── */
  .hero-term .term{
    margin-top: clamp(20px, 4vw, 40px);
    background: var(--ink);
    color: var(--paper);
    border-radius: 10px;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.35), 0 8px 24px -10px rgba(0,0,0,.25);
    overflow: hidden;
    max-width: 920px;
    font-family: var(--mono);
  }
  html[data-theme="dark"] .hero-term .term{ background:#0c0a07; color:#e8dfca; box-shadow:0 30px 80px -20px rgba(0,0,0,.6); }
  .hero-term .term-chrome{
    display:flex; align-items:center; gap:8px;
    padding: 12px 14px;
    background: rgba(255,255,255,.05);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .hero-term .td{ width:11px; height:11px; border-radius:50%; display:inline-block; }
  .hero-term .term-title{
    margin-left:auto; font-size:11px; color:rgba(255,255,255,.45); letter-spacing:.06em;
  }
  .hero-term .term-body{
    padding: 22px 26px 28px;
    font-size: clamp(13px, 1.3vw, 15.5px);
    line-height: 1.65;
    min-height: 380px;
  }
  .hero-term .term-line.prompt{ color: var(--highlight); }
  .hero-term .term-line.out{ color: rgba(255,255,255,.82); }
  html[data-theme="dark"] .hero-term .term-line.out{ color: rgba(232,223,202,.82); }
  .hero-term .term-line.prompt::after{
    content: ""; display:inline-block; width:8px; height:1em; background: var(--highlight);
    margin-left:6px; vertical-align: -2px; animation: blink 1s steps(1) infinite;
  }
  .hero-term .term-line.prompt:not(:last-child)::after{ display:none; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ─────────── Playful hero ─────────── */
  .hero-play{ padding-bottom: clamp(60px, 8vw, 100px); }
  .hero-play .kbd{
    display:inline-block; padding: 2px 8px; border:1px solid var(--rule); border-radius:5px;
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-2);
    background: var(--paper-2); box-shadow: 0 1px 0 var(--rule);
    margin: 0 2px;
  }
  .play-grid{
    display:grid;
    grid-template-columns: 1.4fr .8fr .8fr;
    grid-template-rows: auto auto;
    gap: 14px;
    margin-top: clamp(28px, 5vw, 60px);
  }
  @media (max-width: 860px){
    .play-grid{ grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 560px){
    .play-grid{ grid-template-columns: 1fr; }
  }
  .play-cell{
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 28px 26px;
    background: var(--paper);
    position: relative;
    transition: transform .35s cubic-bezier(.3,.7,.3,1), box-shadow .35s;
  }
  .play-cell:hover{ transform: translateY(-3px); box-shadow: 0 16px 40px -20px rgba(0,0,0,.18); }
  .play-cell.name{ grid-column: span 2; grid-row: span 2; padding: 38px 38px 32px; display:flex; flex-direction:column; justify-content:space-between; min-height: 380px; }
  @media (max-width:560px){ .play-cell.name{ grid-column:auto; grid-row:auto; min-height: 260px; } }
  .play-name{
    font-family: var(--serif);
    font-size: clamp(72px, 12vw, 168px);
    line-height: .9;
    letter-spacing: -.02em;
    color: var(--ink);
  }
  .play-name .it{ color: var(--accent); }
  .play-tag{
    font-family: var(--serif); font-style: italic;
    font-size: clamp(18px, 1.6vw, 22px);
    color: var(--ink-2);
    max-width: 32ch;
  }
  .play-cell.role ul{ list-style:none; padding:0; margin: 14px 0 0; display:flex; flex-direction:column; gap:8px; font-size: 14px; }
  .play-cell.role li::before{
    content: "·"; color: var(--accent); margin-right: 8px; font-weight: 700;
  }
  .play-cell.role li b{ color: var(--ink); font-weight: 600; }

  .play-cell.card{
    background: var(--ink);
    color: var(--paper);
    perspective: 900px;
    overflow: hidden;
    cursor: default;
    aspect-ratio: 5/7;
    min-height: 220px;
  }
  .play-cell.card .play-card-face,
  .play-cell.card .play-card-back{
    position: absolute; inset: 18px;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 6px;
    transition: transform .8s cubic-bezier(.4,.1,.3,1);
    backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    background: var(--ink);
  }
  .play-cell.card .play-card-face{ transform: rotateY(180deg); }
  .play-cell.card:hover .play-card-face{ transform: rotateY(0deg); }
  .play-cell.card:hover .play-card-back{ transform: rotateY(-180deg); }
  .play-cell.card .suit, .play-cell.card .suit-r{
    position: absolute; font-size: 18px; color: var(--paper);
  }
  .play-cell.card .suit{ top:10px; left:12px; }
  .play-cell.card .suit-r{ bottom:10px; right:12px; transform: rotate(180deg); }
  .play-cell.card .rank{ font-family: var(--serif); font-size: clamp(60px, 9vw, 110px); color: var(--accent); line-height: 1; }
  .play-cell.card .card-back-pattern{
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(45deg, var(--accent) 0 6px, transparent 6px 12px),
      repeating-linear-gradient(-45deg, var(--accent) 0 6px, transparent 6px 12px),
      var(--ink);
    opacity: .35;
  }

  .play-cell.quote{
    grid-column: span 2;
    padding: 32px 32px 28px;
  }
  @media (max-width:560px){ .play-cell.quote{ grid-column:auto; } }
  .play-q{
    font-family: var(--serif);
    font-size: clamp(26px, 3.4vw, 44px);
    line-height: 1.1;
    color: var(--ink);
    text-wrap: pretty;
  }
  .play-q .acc{ color: var(--accent); }

  .play-cell.links{
    display: flex; flex-direction: column; gap: 10px; justify-content: center;
    font-family: var(--mono); font-size: 13px;
  }
  .play-cell.links a{ display: block; padding: 8px 0; border-bottom: 1px dashed var(--rule); }
  .play-cell.links a:hover{ color: var(--accent); }
</style>
</head>
